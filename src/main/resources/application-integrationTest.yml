# ----------------------------------------
# TEST
# ----------------------------------------
spring.config.activate.on-profile: integrationTest

spring.config.import: "optional:configserver:${CONFIG_SERVER:http://localhost:8888}/"
spring.cloud.config:
  # Flag to say that remote configuration is enabled. (default false).
  enabled: ${SPRING_CLOUD_CONFIG_ENABLED:false}
  # Flag to indicate that failure to connect to the server is fatal (default false).
  failFast: ${SPRING_CLOUD_CONFIG_FAIL_FAST:true}

# ----------------------------------------
# Postgres - Configured dynamically by Testcontainers
# ----------------------------------------
spring.datasource.postgres.type: com.zaxxer.hikari.HikariDataSource
spring.datasource.postgres.driver-class-name: org.postgresql.Driver
spring.datasource.testOnBorrow: true
spring.datasource.validationQuery: SELECT 1

# ----------------------------------------
# JPA specific configs
# ----------------------------------------
spring.jpa.open-in-view: false
spring.jpa.properties.hibernate.dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
spring.jpa.properties.hibernate.show_sql: false
spring.jpa.properties.hibernate.format_sql: true
spring.jpa.properties.hibernate.use_sql: true
spring.jpa.properties.hibernate.hibernate.dialect: true
spring.jpa.properties.hibernate.id.new_generator_mappings: false
spring.jpa.properties.hibernate.search.autoregister_listeners: false
spring.jpa.properties.hibernate.bytecode.use_reflection_optimizer: false
spring.jpa.properties.hibernate.default_schema: geo_schema
spring.jpa.properties.hibernate.ddl-auto: create-drop

# ----------------------------------------
# Flyway
# ----------------------------------------
spring.flyway.enabled: true
spring.flyway.locations: classpath:/db/migration

# Test-specific settings
spring.test.database.replace: none

# ----------------------------------------
# Redis - Configured dynamically by Testcontainers
# ----------------------------------------
spring.redis:
  password:
  ssl: false
  timeout: 10000
  database: 0
  lettuce:
    pool:
      max-active: 8
      max-idle: 8
      min-idle: 2
      max-wait: 5000
    shutdown-timeout: 100

# ----------------------------------------
# Cache - Configuration
# ----------------------------------------
cache:
  cache-enabled: true
  full-load-enabled: true
  type: redis

# ----------------------------------------
# logging
# ----------------------------------------
logging.level:
  org.springframework: ERROR
  org.flywaydb: INFO
  com.zaxxer.hikari: INFO
  com.cjrequena: INFO
  com.cjrequena.core.eventstore: INFO
logging.pattern:
  console: "%highlight{%-5p | %d{ISO8601}{GMT} | application=${spring.application.name} | traceID=%X{traceId}, spanID=%X{spanId} | %c{1} | %m%ex%n}{
      FATAL=bg_red, 
      ERROR=red, 
      WARN=yellow, 
      INFO=green, 
      DEBUG=blue, 
      TRACE=cyan
    }"
  file: "%-5p| %d{ISO8601}{GMT} | application=${spring.application.name} | traceID=%X{traceId}, spanID=%X{spanId} | %c{1} | %m%ex%n"
