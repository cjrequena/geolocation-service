# ----------------------------------------
# DEFAULT
# ----------------------------------------
server.servlet.context-path: / # Context path of the application.
server.port: ${SERVER_PORT:8080} # Server HTTP port.
spring.application.name: '@project.artifactId@'
spring.application.version: '@project.version@'
spring.profiles.active: ${SPRING_PROFILES_ACTIVE:local}
spring.main.allow-bean-definition-overriding: true # Enable bean override

# ----------------------------------------
# ACTUATOR PROPERTIES
# ----------------------------------------
# ENDPOINTS WEB CONFIGURATION
management.endpoints.web.exposure.include: '*' # Endpoint IDs that should be included or '*' for all.
management.endpoints.web.exposure.exclude:  # Endpoint IDs that should be excluded or '*' for all.
management.endpoints.web.base-path: /management # Base path for Web endpoints. Relative to server.servlet.context-path or management.server.servlet.context-path if management.server.port is configured.
management.endpoints.web.path-mapping.health: healthcheck
# HEALTH ENDPOINT
management.endpoint.health.cache.time-to-live: 0ms # Maximum time that a response can be cached.
management.endpoint.health.access: unrestricted # Allows unrestricted access to the health endpoint
management.endpoint.health.roles:  # Roles used to determine whether or not a user is authorized to be shown details. When empty, all authenticated users are authorized.
management.endpoint.health.show-details: always # When to show full health details.
management.health.circuitbreakers.enabled: true
management.health.ratelimiters.enabled: true
# INFO CONTRIBUTORS (InfoContributorProperties)
management.info.build.enabled: true # Whether to enable build info.
management.info.defaults.enabled: true # Whether to enable default info contributors.
management.info.env.enabled: true # Whether to enable environment info.
management.info.git.enabled: true # Whether to enable git info.
management.info.git.mode: full # Mode to use to expose git information.

management.tracing.sampling.probability: 1.0   # 100% sampling (use lower in prod)
---
# ----------------------------------------
# LOCAL
# ----------------------------------------
spring.config.activate.on-profile: local

spring.config.import: "optional:configserver:${CONFIG_SERVER:http://localhost:8888}/"
spring.cloud.config:
  # Flag to say that remote configuration is enabled. (default false).
  enabled: ${SPRING_CLOUD_CONFIG_ENABLED:false}
  # Flag to indicate that failure to connect to the server is fatal (default false).
  failFast: ${SPRING_CLOUD_CONFIG_FAIL_FAST:true}

# ----------------------------------------
# Postgres
# ----------------------------------------
spring.datasource.postgres.type: com.zaxxer.hikari.HikariDataSource
spring.datasource.postgres.jdbcUrl: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/postgres
spring.datasource.postgres.driver-class-name: org.postgresql.Driver
spring.datasource.postgres.username: postgres
spring.datasource.postgres.password: postgres
spring.datasource.testOnBorrow: true
spring.datasource.validationQuery: SELECT 1

# ----------------------------------------
# JPA specific configs
# ----------------------------------------
spring.jpa.open-in-view: false
# CRITICAL: Use Hibernate 6.x spatial dialect
spring.jpa.properties.hibernate.dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
spring.jpa.properties.hibernate.show_sql: false
spring.jpa.properties.hibernate.format_sql: true
spring.jpa.properties.hibernate.use_sql: true
spring.jpa.properties.hibernate.hibernate.dialect: true
spring.jpa.properties.hibernate.id.new_generator_mappings: false
spring.jpa.properties.hibernate.search.autoregister_listeners: false
spring.jpa.properties.hibernate.bytecode.use_reflection_optimizer: false
spring.jpa.properties.hibernate.default_schema: geo_schema

# ----------------------------------------
# Flyway
# ----------------------------------------
spring.flyway.enabled: false
spring.flyway.locations: classpath:/db/migration
#spring.flyway.schemas: geo_schema

# ----------------------------------------
# Redis - Enhanced Configuration
# ----------------------------------------
spring.redis:
  host: localhost
  port: 6379
  password: # Leave empty for no password
  ssl: false
  timeout: 10000  # 10 seconds
  database: 0
  # Connection Pooling Configuration
  lettuce:
    pool:
      max-active: 8      # Maximum number of connections
      max-idle: 8        # Maximum idle connections
      min-idle: 2        # Minimum idle connections
      max-wait: 5000     # Maximum wait time in ms
    shutdown-timeout: 100  # Shutdown timeout in ms
  # Uncomment for Cluster mode
  #cluster:
  #  nodes:
  #    - 127.0.0.1:7000
  #    - 127.0.0.1:7001
  #    - 127.0.0.1:7002
  #  max-redirects: 3
  # Uncomment for Sentinel mode
  #sentinel:
  #  master: mymaster
  #  nodes:
  #    - 127.0.0.1:26379
  #    - 127.0.0.1:26380
  #    - 127.0.0.1:26381

# ----------------------------------------
# Cache - Configuration
# ----------------------------------------
cache:
  full-load-enabled: true
  type: redis

# ----------------------------------------
# logging
# ----------------------------------------
# https://docs.spring.io/spring-boot/docs/current/reference/htmlsingle/#appendix.application-properties.core
logging.level:
  org.springframework: ERROR
  org.flywaydb: INFO
  com.zaxxer.hikari: INFO
  com.cjrequena: INFO
  com.cjrequena.core.eventstore: INFO
logging.pattern:
  console: "%highlight{%-5p | %d{ISO8601}{GMT} | application=${spring.application.name} | traceID=%X{traceId}, spanID=%X{spanId} | %c{1} | %m%ex%n}{
      FATAL=bg_red, 
      ERROR=red, 
      WARN=yellow, 
      INFO=green, 
      DEBUG=blue, 
      TRACE=cyan
    }"
  file: "%-5p| %d{ISO8601}{GMT} | application=${spring.application.name} | traceID=%X{traceId}, spanID=%X{spanId} | %c{1} | %m%ex%n"

